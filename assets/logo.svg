<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>

    <!-- Primary gradient (Blue to Purple) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>

    <!-- Success gradient (Green) -->
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>

    <!-- Orange gradient for brace style -->
    <linearGradient id="braceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="240" fill="url(#bgGrad)"/>

  <!-- Logo Icon Section (Left 240px) -->
  <g transform="translate(40, 50)">
    <!-- Main container circle -->
    <circle cx="70" cy="70" r="60" fill="none" stroke="#334155" stroke-width="2" opacity="0.5"/>

    <!-- Entry point -->
    <circle cx="70" cy="30" r="8" fill="url(#primaryGrad)" filter="url(#shadow)"/>

    <!-- Dual paths visualization -->
    <!-- Left path (colon syntax) -->
    <path d="M 70 38 L 40 70 L 40 110" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="40" cy="70" r="4" fill="url(#primaryGrad)"/>
    <text x="20" y="74" font-family="monospace" font-size="14" fill="#3b82f6" font-weight="bold">:id</text>

    <!-- Right path (brace syntax) -->
    <path d="M 70 38 L 100 70 L 100 110" fill="none" stroke="url(#braceGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="100" cy="70" r="4" fill="url(#braceGrad)"/>
    <text x="108" y="74" font-family="monospace" font-size="14" fill="#f59e0b" font-weight="bold">{id}</text>

    <!-- Success indicators -->
    <circle cx="40" cy="115" r="12" fill="url(#successGrad)" filter="url(#shadow)"/>
    <path d="M 34 115 L 38 119 L 46 111" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="100" cy="115" r="12" fill="url(#successGrad)" filter="url(#shadow)"/>
    <path d="M 94 115 L 98 119 L 106 111" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Double-sided arrow -->
    <g transform="translate(55, 90)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
      <polygon points="0,0 5,-3 5,3" fill="#94a3b8"/>
      <polygon points="30,0 25,-3 25,3" fill="#94a3b8"/>
    </g>
  </g>

  <!-- Project Name -->
  <text x="280" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#primaryGrad)" filter="url(#shadow)">
    Dual Parser
  </text>

  <!-- Tagline -->
  <text x="280" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">
    Path matcher supporting both colon and brace URI template syntax
  </text>

  <!-- Feature Badges -->
  <g transform="translate(280, 155)">
    <!-- TypeScript Badge -->
    <rect x="0" y="0" width="95" height="26" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="18" cy="13" r="6" fill="#3b82f6"/>
    <text x="18" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">TS</text>
    <text x="52" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">TypeScript</text>

    <!-- Zero Dep Badge -->
    <rect x="105" y="0" width="85" height="26" rx="4" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="123" cy="13" r="6" fill="#22c55e"/>
    <text x="123" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">✓</text>
    <text x="152" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">1 Dep</text>

    <!-- Tiny Badge -->
    <rect x="200" y="0" width="70" height="26" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="235" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Tiny</text>

    <!-- Dual Syntax Badge -->
    <rect x="280" y="0" width="110" height="26" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="335" y="17" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Dual Syntax</text>
  </g>

  <!-- Code Examples (Bottom Right) -->
  <g transform="translate(580, 30)">
    <rect x="0" y="0" width="400" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Code header -->
    <rect x="0" y="0" width="400" height="30" rx="8" fill="#334155"/>
    <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Example Usage</text>

    <!-- Window controls -->
    <circle cx="375" cy="15" r="4" fill="#ef4444"/>
    <circle cx="385" cy="15" r="4" fill="#fbbf24"/>
    <circle cx="395" cy="15" r="4" fill="#22c55e"/>

    <!-- Code content -->
    <text font-family="'SF Mono', 'Monaco', 'Cascadia Code', monospace" font-size="12" fill="#e2e8f0">
      <tspan x="15" y="55" fill="#c084fc">import</tspan>
      <tspan fill="#e2e8f0"> { match, parse } </tspan>
      <tspan fill="#c084fc">from</tspan>
      <tspan fill="#22c55e"> '@jswork/path-dual-parser'</tspan>

      <tspan x="15" y="80" fill="#64748b">// Colon syntax</tspan>
      <tspan x="15" y="100" fill="#3b82f6">match</tspan>
      <tspan fill="#e2e8f0">(</tspan>
      <tspan fill="#22c55e">'/users/:id'</tspan>
      <tspan fill="#e2e8f0">)(</tspan>
      <tspan fill="#22c55e">'/users/123'</tspan>
      <tspan fill="#e2e8f0">)</tspan>

      <tspan x="15" y="125" fill="#64748b">// Brace syntax (URI Template)</tspan>
      <tspan x="15" y="145" fill="#3b82f6">match</tspan>
      <tspan fill="#e2e8f0">(</tspan>
      <tspan fill="#22c55e">'/users/{id}'</tspan>
      <tspan fill="#e2e8f0">)(</tspan>
      <tspan fill="#22c55e">'/users/456'</tspan>
      <tspan fill="#e2e8f0">)</tspan>

      <tspan x="15" y="170" fill="#64748b">// Both return: { path, params }</tspan>
    </text>
  </g>
</svg>